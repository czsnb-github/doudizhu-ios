name: Offline two-client E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        working-directory: tools/offline-e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: OTA manifest unit tests
        run: |
          python -m unittest tests.test_ota_build -v

      - name: Serve offline WebAssets
        run: |
          nohup python3 -m http.server 8080 --directory ios/Doudizhu/WebAssets > /tmp/http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/http.log
          exit 1

      - name: Run two-client offline E2E
        working-directory: tools/offline-e2e
        env:
          BASE_URL: http://127.0.0.1:8080/
        run: |
          set -o pipefail
          node test.mjs 2>&1 | tee e2e.log

      - name: Upload E2E debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-e2e-debug
          path: |
            tools/offline-e2e/e2e.log
            tools/offline-e2e/shots/offline-e2e-*.png
          if-no-files-found: warn

      - name: Publish E2E debug release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: e2e-debug
          name: E2E debug
          body: "离线双客户端 E2E 失败日志与截图（自动更新）"
          prerelease: true
          files: |
            tools/offline-e2e/e2e.log
            tools/offline-e2e/shots/offline-e2e-*.png
