name: iOS unsigned build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Prepare simulator
        working-directory: ios
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '.runtimes[] | select(.platform=="iOS" and .isAvailable==true) | .identifier' | head -1)
          if [ -z "$RUNTIME" ]; then
            echo "没有可用的 iOS 模拟器运行时"
            xcrun simctl list runtimes
            exit 1
          fi
          DEVTYPE=$(xcrun simctl list devicetypes -j | jq -r '.devicetypes[] | select(.name=="iPhone 16") | .identifier' | head -1)
          if [ -z "$DEVTYPE" ]; then
            DEVTYPE=$(xcrun simctl list devicetypes -j | jq -r '.devicetypes[] | select(.name | startswith("iPhone")) | .identifier' | head -1)
          fi
          UDID=$(xcrun simctl create "CI iPhone" "$DEVTYPE" "$RUNTIME")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "使用模拟器 $UDID（$RUNTIME）"

      - name: Unit tests (simulator)
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Doudizhu.xcodeproj \
            -scheme Doudizhu \
            -destination "id=$SIM_UDID" \
            -derivedDataPath simbuild \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Launch app in simulator and screenshot
        working-directory: ios
        run: |
          set -euo pipefail
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl install "$SIM_UDID" simbuild/Build/Products/Debug-iphonesimulator/Doudizhu.app
          xcrun simctl launch "$SIM_UDID" com.molemanor.doudizhu
          sleep 3
          xcrun simctl io "$SIM_UDID" screenshot simulator-lobby.png
          ls -lh simulator-lobby.png

      - name: Upload simulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: iOS-simulator-lobby
          path: ios/simulator-lobby.png
          if-no-files-found: error

      - name: Build unsigned app
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project Doudizhu.xcodeproj \
            -scheme Doudizhu \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          set -euo pipefail
          mkdir -p artifacts/Payload
          cp -R build/Build/Products/Release-iphoneos/Doudizhu.app artifacts/Payload/
          cd artifacts
          zip -qry Doudizhu-unsigned.ipa Payload
          ls -lh Doudizhu-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Doudizhu-unsigned-ipa
          path: ios/artifacts/Doudizhu-unsigned.ipa
          if-no-files-found: error
