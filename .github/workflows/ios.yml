name: iOS unsigned build

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "跳过单测，仅做 UI 截图与 IPA（UI 迭代用）"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Prepare simulator
        working-directory: ios
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '.runtimes[] | select(.platform=="iOS" and .isAvailable==true) | .identifier' | head -1)
          if [ -z "$RUNTIME" ]; then
            echo "没有可用的 iOS 模拟器运行时"
            xcrun simctl list runtimes
            exit 1
          fi
          DEVTYPE=$(xcrun simctl list devicetypes -j | jq -r '.devicetypes[] | select(.name=="iPhone 16") | .identifier' | head -1)
          if [ -z "$DEVTYPE" ]; then
            DEVTYPE=$(xcrun simctl list devicetypes -j | jq -r '.devicetypes[] | select(.name | startswith("iPhone")) | .identifier' | head -1)
          fi
          UDID=$(xcrun simctl create "CI iPhone" "$DEVTYPE" "$RUNTIME")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "使用模拟器 ${UDID} (${RUNTIME})"

      - name: Unit tests (simulator)
        if: ${{ !inputs.skip_tests }}
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Doudizhu.xcodeproj \
            -scheme Doudizhu \
            -destination "id=$SIM_UDID" \
            -derivedDataPath simbuild \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build for simulator (screenshot only)
        if: ${{ github.event_name == 'push' || inputs.skip_tests }}
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project Doudizhu.xcodeproj \
            -scheme Doudizhu \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIM_UDID" \
            -derivedDataPath simbuild \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Launch app in simulator and screenshot
        working-directory: ios
        run: |
          set -euo pipefail
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          sleep 5
          xcrun simctl install "$SIM_UDID" simbuild/Build/Products/Debug-iphonesimulator/Doudizhu.app
          xcrun simctl launch "$SIM_UDID" com.molemanor.doudizhu
          sleep 30
          xcrun simctl io "$SIM_UDID" screenshot simulator-lobby.png
          ls -lh simulator-lobby.png

      - name: Upload simulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: iOS-simulator-lobby
          path: ios/simulator-lobby.png
          if-no-files-found: error

      - name: Build unsigned app
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project Doudizhu.xcodeproj \
            -scheme Doudizhu \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          set -euo pipefail
          mkdir -p artifacts/Payload
          cp -R build/Build/Products/Release-iphoneos/Doudizhu.app artifacts/Payload/
          cd artifacts
          zip -qry Doudizhu-unsigned.ipa Payload
          ls -lh Doudizhu-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Doudizhu-unsigned-ipa
          path: ios/artifacts/Doudizhu-unsigned.ipa
          if-no-files-found: error

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: iOS 最新构建
          body: "本机离线版未签名 IPA；下载后用签名工具安装。每次构建自动更新。"
          prerelease: true
          files: |
            ios/artifacts/Doudizhu-unsigned.ipa
            ios/simulator-lobby.png
