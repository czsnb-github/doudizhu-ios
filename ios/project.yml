name: Doudizhu
options:
  bundleIdPrefix: com.molemanor
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Doudizhu:
    type: application
    platform: iOS
    sources:
      - path: Doudizhu
        excludes:
          - Info.plist
          - WebAssets
      - path: Doudizhu/WebAssets
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.molemanor.doudizhu
        INFOPLIST_FILE: Doudizhu/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        PRODUCT_NAME: Doudizhu
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DoudizhuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DoudizhuTests
    dependencies:
      - target: Doudizhu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.molemanor.doudizhu.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Doudizhu.app/Doudizhu"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Doudizhu:
    build:
      targets:
        Doudizhu: all
        DoudizhuTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DoudizhuTests
      environmentVariables:
        MANOR_DISABLE_LOCAL_UI: "1"
    archive:
      config: Release
